<!DOCTYPE html>
<html>
<head>
    <link href="https://fonts.googleapis.com/css?family=Italianno&display=swap" rel="stylesheet" />
    <link href="./css/main.css" rel="stylesheet" />
    <title>Graff - Luxury Jewelry Boutique</title>
</head>

<body>

    <div class="background">
        <span></span>
        <span></span>

            <nav>

                    <li><a href="/companypage/index.html">Company</a></li>
                    <li><a href="/aboutuspage/index.html">About Us</a></li>
                </ul>
            </nav>
        </header>

        <main>

                <p class="tagline">A Luxury Jewelry Boutique</p>

                                <div class="image-container">
                                    <img src="./images/1.jpg" alt="Luxury jewelry piece 1">

                            <div class="carousel-slide">

                                <div class="image-container">

                            <div class="carousel-slide">

                                    <img src="./images/10.jpg" alt="Luxury jewelry piece 10">

                            </div>

                            <div class="carousel-slide">
                                <div class="image-container">

                            <div class="carousel-slide">
                                <div class="image-container">
                                    <img src="./images/12.jpg" alt="Luxury jewelry piece 12">
                                </div>
                            </div>

                        </div>
                    </div>

                    <button
                        class="carousel-button next"
                        aria-label="Next slide">
                        &gt;
                    </button>

                </div>

                <div class="carousel-dots"></div>

            </section>

            <div class="location-section">

                <h2>Visit Our Boutique</h2>

                <div class="location-card">

                    <h3>123 Luxury Avenue, Fashion District</h3>

                    <div id="map" class="map-container"></div>

                </div>

            </div>

    </div>

    <script src="./script.js"></script>
